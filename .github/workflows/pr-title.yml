# PR titles become the commit message on main (squash merge), and release-please builds the
# release notes from them. This check fails a PR whose title is not a Conventional Commit, e.g.
#   feat: show storage in the sidebar      → listed under Features, minor version bump
#   fix: scan no longer stalls on symlinks → listed under Bug Fixes, patch version bump
#   docs: / ci: / chore: / refactor: / test: → not listed, no release
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest # a few seconds of API checks; does not need this Mac
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            style
            refactor
            test
            build
            ci
            chore
